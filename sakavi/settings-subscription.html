<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Subscription · Sakavi</title>
<meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="app">
  <div class="top-bar">
    <a class="back" href="settings.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="top-title">Subscription</div>
  </div>
  
<div class="content">
  <div class="intro">Manage your Sakavi subscription.</div>
  <div class="group">
    <div class="item" style="cursor:default;"><div class="body"><div class="label">Plan</div><div class="sub">Free</div></div></div>
    <div class="item" style="cursor:default;"><div class="body"><div class="label">Renewal</div><div class="sub">—</div></div></div>
    <div class="item" style="cursor:default;"><div class="body"><div class="label">Payment method</div><div class="sub">None</div></div></div>
  </div>
  <a class="btn secondary" href="settings-upgrade.html" style="text-decoration:none;">View plans</a>
</div>

</div>
<script src="js/config.js"></script>
<script src="js/sakavi-core.js"></script>
<script>
function pref(key, def) {
  try { const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}'); return s[key] ?? def; } catch(_) { return def; }
}
function setPref(key, val) {
  try {
    const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}');
    s[key] = val;
    localStorage.setItem('sakavi_settings_v1', JSON.stringify(s));
  } catch(_) {}
}

</script>
</body>
</html>
