<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trusted contact · Sakavi</title>
<meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="app">
  <div class="top-bar">
    <a class="back" href="settings.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="top-title">Trusted contact</div>
  </div>
  
<div class="content">
  <div class="intro">Add someone who can help if you get locked out or need emergency account support.</div>
  <div class="field"><label>Name</label><input id="tcName" placeholder="Full name"></div>
  <div class="field"><label>Email</label><input id="tcEmail" type="email" placeholder="friend@email.com"></div>
  <div class="field"><label>Phone</label><input id="tcPhone" type="tel" placeholder="+91…"></div>
  <button type="button" class="btn primary" id="saveTc">Save trusted contact</button>
  <button type="button" class="btn danger" id="clearTc">Remove</button>
</div>

</div>
<script src="js/config.js"></script>
<script src="js/sakavi-core.js"></script>
<script>
function pref(key, def) {
  try { const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}'); return s[key] ?? def; } catch(_) { return def; }
}
function setPref(key, val) {
  try {
    const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}');
    s[key] = val;
    localStorage.setItem('sakavi_settings_v1', JSON.stringify(s));
  } catch(_) {}
}

document.getElementById('tcName').value = pref('tcName','');
document.getElementById('tcEmail').value = pref('tcEmail','');
document.getElementById('tcPhone').value = pref('tcPhone','');
document.getElementById('saveTc').onclick = () => {
  setPref('tcName', document.getElementById('tcName').value.trim());
  setPref('tcEmail', document.getElementById('tcEmail').value.trim());
  setPref('tcPhone', document.getElementById('tcPhone').value.trim());
  alert('Saved');
};
document.getElementById('clearTc').onclick = () => {
  ['tcName','tcEmail','tcPhone'].forEach(k => setPref(k,''));
  location.reload();
};

</script>
</body>
</html>
