<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sakavi — AI Assistant</title>
    <meta name="description" content="Sakavi is your AI assistant for chat, study help, writing, and ideas.">
    <meta name="theme-color" content="#0e0e14">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/sakavi.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <a class="icon-btn" href="history.html" title="History" aria-label="Chat history">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
            </a>
            <div class="avatar-logo">S</div>
            <div class="header-title">
                <h1>Sakavi <span id="demoBadge" class="badge-demo" style="display:none;">Demo</span></h1>
                <p id="statusLine">Ready</p>
            </div>
            <button class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <a class="icon-btn" href="settings.html" title="Settings" aria-label="Settings">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </a>
        </header>

        <div id="hero" class="hero">
            <div class="logo-lg">S</div>
            <h2>Hi, I’m Sakavi</h2>
            <p>Ask anything — writing, study help, code, plans. Your chats stay on this device until you connect the live model.</p>
            <div class="suggestions" id="suggestions">
                <button type="button" class="chip" data-q="Explain this simply: what is working capital?">Study: working capital</button>
                <button type="button" class="chip" data-q="Help me draft a polite follow-up email">Draft a follow-up email</button>
                <button type="button" class="chip" data-q="Give me 5 ideas for a weekend project">Weekend project ideas</button>
                <button type="button" class="chip" data-q="Fix this JS: const x = [1,2,3; console.log(x)">Debug a JS snippet</button>
            </div>
        </div>

        <div class="chat-log" id="chatLog" style="display:none;"></div>

        <div class="composer-wrap">
            <div class="meta-bar">
                <span class="pill" id="modelPill">Sakavi 1</span>
                <span class="pill" id="lenPill">Balanced</span>
            </div>
            <div class="composer">
                <textarea id="input" rows="1" placeholder="Message Sakavi…" autocomplete="off"></textarea>
                <button type="button" class="send-btn" id="sendBtn" aria-label="Send" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/sakavi-core.js"></script>
    <script>
(function () {
    const params = new URLSearchParams(location.search);
    let chatId = params.get('c') || null;
    let chat = chatId ? Sakavi.getChat(chatId) : null;
    if (!chat) {
        chat = { id: Sakavi.uid(), title: 'New chat', messages: [], updatedAt: Date.now() };
        chatId = chat.id;
    }

    const log = document.getElementById('chatLog');
    const hero = document.getElementById('hero');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const statusLine = document.getElementById('statusLine');
    const settings = Sakavi.loadSettings();

    document.getElementById('modelPill').textContent = settings.model === 'sakavi-1' ? 'Sakavi 1' : settings.model;
    document.getElementById('lenPill').textContent = settings.length.charAt(0).toUpperCase() + settings.length.slice(1);

    function showChatUI() {
        hero.style.display = 'none';
        log.style.display = 'flex';
    }

    function appendMsg(role, content, typing) {
        showChatUI();
        const div = document.createElement('div');
        div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
        if (typing) {
            div.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
        } else {
            div.innerHTML = '<div class="bubble">' + Sakavi.formatMessage(content) + '</div>';
        }
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
    }

    function renderAll() {
        log.innerHTML = '';
        if (!chat.messages.length) {
            hero.style.display = 'flex';
            log.style.display = 'none';
            return;
        }
        showChatUI();
        chat.messages.forEach((m) => appendMsg(m.role, m.content));
    }

    function persist() {
        chat.title = Sakavi.titleFromMessages(chat.messages);
        chat.updatedAt = Date.now();
        Sakavi.upsertChat(chat);
        history.replaceState(null, '', '?c=' + chat.id);
    }

    async function send(text) {
        text = (text || input.value || '').trim();
        if (!text) return;
        input.value = '';
        autoSize();
        sendBtn.disabled = true;

        chat.messages.push({ role: 'user', content: text, at: Date.now() });
        appendMsg('user', text);
        persist();

        const typingEl = appendMsg('bot', '', true);
        statusLine.textContent = 'Thinking…';

        try {
            const history = settings.rememberContext
                ? chat.messages.map((m) => ({ role: m.role, content: m.content }))
                : [{ role: 'user', content: text }];
            const { text: reply, source } = await Sakavi.generateReply(history, settings);
            typingEl.remove();
            chat.messages.push({ role: 'assistant', content: reply, at: Date.now(), source });
            appendMsg('bot', reply);
            persist();
            statusLine.textContent = source === 'demo' ? 'Demo mode' : 'Ready';
            document.getElementById('demoBadge').style.display = source === 'demo' ? 'inline' : 'none';
        } catch (e) {
            typingEl.remove();
            const err = 'Sorry — ' + (e.message || 'something went wrong') + '. Check Settings / API config.';
            chat.messages.push({ role: 'assistant', content: err, at: Date.now() });
            appendMsg('bot', err);
            persist();
            statusLine.textContent = 'Error';
        }
        sendBtn.disabled = !input.value.trim();
        input.focus();
    }

    function autoSize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
        sendBtn.disabled = !input.value.trim();
    }

    input.addEventListener('input', autoSize);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });
    sendBtn.addEventListener('click', () => send());
    document.getElementById('newChatBtn').addEventListener('click', () => {
        location.href = 'index.html';
    });
    document.querySelectorAll('.chip').forEach((c) => {
        c.addEventListener('click', () => send(c.dataset.q));
    });

    renderAll();
    if (chat.messages.some((m) => m.source === 'demo')) {
        document.getElementById('demoBadge').style.display = 'inline';
        statusLine.textContent = 'Demo mode';
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
})();
    </script>
</body>
</html>
