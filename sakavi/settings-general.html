<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>General · Sakavi</title>
<meta name="theme-color" content="#07070b">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="app">
  <div class="top-bar">
    <a class="back" href="settings" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="top-title">General</div>
  </div>
  <div class="content"><div class="intro">Language, haptics, and everyday behavior.</div><div class="group"><div class="row-toggle">
      <div class="body"><div class="label">Haptics</div><div class="sub">Vibration feedback on actions</div></div>
      <label class="switch"><input type="checkbox" id="haptics" checked><span></span></label>
    </div><div class="row-toggle">
      <div class="body"><div class="label">Enter to send</div><div class="sub">Press Enter to send messages</div></div>
      <label class="switch"><input type="checkbox" id="enterSend" checked><span></span></label>
    </div><div class="row-toggle">
      <div class="body"><div class="label">Suggested prompts</div><div class="sub">Show starter chips on new chat</div></div>
      <label class="switch"><input type="checkbox" id="suggestChips" checked><span></span></label>
    </div></div></div>
</div>
<script src="js/config.js"></script>
<script src="js/sakavi-core.js"></script>
<script>
if (window.Sakavi && Sakavi.applyTheme) Sakavi.applyTheme();
function pref(key, def) {
  try { const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}'); return s[key] ?? def; } catch(_) { return def; }
}
function setPref(key, val) {
  try {
    const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}');
    s[key] = val;
    localStorage.setItem('sakavi_settings_v1', JSON.stringify(s));
  } catch(_) {}
}

const ids = ['haptics', 'enterSend', 'suggestChips'];
ids.forEach(id => {
  const el = document.getElementById(id);
  const v = pref(id, el.checked);
  el.checked = !!v;
  el.addEventListener('change', () => setPref(id, el.checked));
});

const lang = pref('language','English');

</script>
</body>
</html>
