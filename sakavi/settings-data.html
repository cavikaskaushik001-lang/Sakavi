<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Data controls · Sakavi</title>
<meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="app">
  <div class="top-bar">
    <a class="back" href="settings.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="top-title">Data controls</div>
  </div>
  
<div class="content">
  <div class="intro">Control how your data is used to improve Sakavi.</div>
  <div class="group">
    <div class="row-toggle"><div class="body"><div class="label">Improve the model</div><div class="sub">Allow chats to help training (off by default in demo)</div></div><label class="switch"><input type="checkbox" id="trainOn"><span></span></label></div>
    <div class="row-toggle"><div class="body"><div class="label">Export my data</div><div class="sub">Download chats as JSON</div></div></div>
  </div>
  <button type="button" class="btn secondary" id="exportBtn">Export chats</button>
  <button type="button" class="btn danger" id="wipeBtn">Delete account data on device</button>
</div>

</div>
<script src="js/config.js"></script>
<script src="js/sakavi-core.js"></script>
<script>
function pref(key, def) {
  try { const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}'); return s[key] ?? def; } catch(_) { return def; }
}
function setPref(key, val) {
  try {
    const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}');
    s[key] = val;
    localStorage.setItem('sakavi_settings_v1', JSON.stringify(s));
  } catch(_) {}
}

const t=document.getElementById('trainOn');
t.checked=!!pref('trainOn',false);
t.onchange=()=>setPref('trainOn', t.checked);
document.getElementById('exportBtn').onclick=()=>{
  const data = localStorage.getItem('sakavi_chats_v1')||'[]';
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sakavi-chats.json'; a.click();
};
document.getElementById('wipeBtn').onclick=()=>{
  if(!confirm('Remove Sakavi chats & settings from this device?')) return;
  Object.keys(localStorage).filter(k=>k.startsWith('sakavi')).forEach(k=>localStorage.removeItem(k));
  location.href='index.html';
};

</script>
</body>
</html>
