<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Security and login · Sakavi</title>
<meta name="theme-color" content="#000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="app">
  <div class="top-bar">
    <a class="back" href="settings.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="top-title">Security and login</div>
  </div>
  
<div class="content">
  <div class="intro">Protect your Sakavi account on this device.</div>
  <div class="group">
    <div class="row-toggle"><div class="body"><div class="label">App lock</div><div class="sub">Require unlock to open Sakavi</div></div><label class="switch"><input type="checkbox" id="appLock"><span></span></label></div>
    <div class="row-toggle"><div class="body"><div class="label">Login alerts</div><div class="sub">Notify on new device sign-in</div></div><label class="switch"><input type="checkbox" id="loginAlerts" checked><span></span></label></div>
  </div>
  <div class="group" style="margin-top:12px;">
    <a class="item" href="#" id="changePw"><div class="body"><div class="label">Change password</div></div><div class="trail"><span class="chev">›</span></div></a>
    <a class="item" href="#" id="sessions"><div class="body"><div class="label">Active sessions</div><div class="sub">This device</div></div><div class="trail"><span class="chev">›</span></div></a>
  </div>
</div>

</div>
<script src="js/config.js"></script>
<script src="js/sakavi-core.js"></script>
<script>
function pref(key, def) {
  try { const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}'); return s[key] ?? def; } catch(_) { return def; }
}
function setPref(key, val) {
  try {
    const s = JSON.parse(localStorage.getItem('sakavi_settings_v1')||'{}');
    s[key] = val;
    localStorage.setItem('sakavi_settings_v1', JSON.stringify(s));
  } catch(_) {}
}

['appLock','loginAlerts'].forEach(id=>{
  const el=document.getElementById(id);
  el.checked=!!pref(id, id==='loginAlerts');
  el.onchange=()=>setPref(id, el.checked);
});
document.getElementById('changePw').onclick=e=>{ e.preventDefault(); alert('Password change uses your auth provider (Supabase).'); };
document.getElementById('sessions').onclick=e=>{ e.preventDefault(); alert('Only this browser session in demo mode.'); };

</script>
</body>
</html>
